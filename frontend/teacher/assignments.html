<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Assignments | EklavyaX</title>
  <link rel="icon" type="image/png" href="../assets/img/logo.png?v=2026.1">
  <link rel="stylesheet" href="../css/global.css?v=2026.1">
  <link rel="stylesheet" href="../css/teacher_dashboard.css?v=2026.1">
  <link rel="stylesheet" href="../css/app_pages.css?v=2026.1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>

<body>
  <div class="container" style="display:flex;">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" role="navigation" aria-label="Sidebar menu">
      <div class="logo">
        <img src="../assets/img/logo.png?v=3.0" alt="EklavyaX Logo">
        <span class="logo-text">EklavyaX</span>
      </div>
      <nav class="menu" aria-label="Primary">
        <a href="dashboard.html"><i class="fas fa-home" aria-hidden="true"></i> Home</a>
        <a href="myclass.html"><i class="fas fa-users" aria-hidden="true"></i> My Class</a>
        <a href="student_progress.html"><i class="fas fa-chart-line" aria-hidden="true"></i> Student Progress</a>
        <a href="doubts.html"><i class="fas fa-question" aria-hidden="true"></i> Doubts</a>
        <a class="active" href="assignments.html"><i class="fas fa-list-ul" aria-hidden="true"></i> Assignments</a>
        <a href="content_library.html"><i class="fas fa-book" aria-hidden="true"></i> Content Library</a>
        <a href="announcements.html"><i class="fas fa-bullhorn" aria-hidden="true"></i> Announcement</a>
        <a href="settings.html" id="settingsBtn"><i class="fas fa-cog" aria-hidden="true"></i> Settings</a>
      </nav>

      <div class="profile" role="button" aria-pressed="false" aria-label="Edit Profile">
        <img id="userAvatarImg" src="../assets/img/teacher_male.jpg" alt="Teacher's profile icon" />
        <div class="profile-info">
          <strong id="profileName">Aarav Singh</strong>
          <span id="profileAction">Log out</span>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="content-area" role="main">
      <header class="page-header">
        <div class="page-title">
          <h1><i class="fas fa-list-ul" style="color: var(--marigold);"></i> Class Assignments Management</h1>
          <p>Create new assignments, review student submissions, and grade work.</p>
        </div>
        <div class="header-actions">
          <button class="btn-primary" onclick="EklavyaXPages.openModal('createAssignmentModal')">
            <i class="fas fa-plus"></i> Create Assignment
          </button>
        </div>
      </header>

      <!-- Filter Bar -->
      <section class="filter-bar">
        <div class="tab-group">
          <button class="tab-btn active" data-tab="all">All Assignments</button>
          <button class="tab-btn" data-tab="pending">Active</button>
          <button class="tab-btn" data-tab="submitted">Needs Review</button>
          <button class="tab-btn" data-tab="graded">Graded</button>
        </div>
      </section>

      <!-- Assignments Grid -->
      <section class="assignments-grid" id="assignmentsGrid">
        <!-- Rendered by app_pages.js -->
      </section>
    </main>
  </div>

  <!-- Create Assignment Modal -->
  <div class="app-modal" id="createAssignmentModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2><i class="fas fa-plus-circle"></i> Create New Assignment</h2>
        <button class="close-modal" onclick="EklavyaXPages.closeModal('createAssignmentModal')">&times;</button>
      </div>
      <form id="createAssignmentForm" style="display:flex; flex-direction:column; gap:14px;">
        <div class="form-group">
          <label>Subject</label>
          <select id="assignSubject" class="form-control" required>
            <option value="physics">Physics</option>
            <option value="chemistry">Chemistry</option>
            <option value="math">Mathematics</option>
            <option value="biology">Biology</option>
          </select>
        </div>
        <div class="form-group">
          <label>Assignment Title</label>
          <input type="text" id="assignTitle" class="form-control" placeholder="e.g. Electromagnetic Induction Worksheet" required>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
          <div class="form-group">
            <label>Due Date</label>
            <input type="text" id="assignDueDate" class="form-control" placeholder="e.g. 25 Aug 2026, 11:59 PM" required>
          </div>
          <div class="form-group">
            <label>Max Marks</label>
            <input type="number" id="assignPoints" class="form-control" value="100" required>
          </div>
        </div>
        <div class="form-group">
          <label>EduCoins Bonus Reward</label>
          <input type="number" id="assignCoins" class="form-control" value="50" required>
        </div>
        <div class="form-group">
          <label>Instructions & Syllabus Details</label>
          <textarea id="assignInstructions" class="form-control" placeholder="Provide problem numbers or guidelines..." required></textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:10px;">
          <button type="button" class="btn-secondary" onclick="EklavyaXPages.closeModal('createAssignmentModal')">Cancel</button>
          <button type="submit" class="btn-primary">Post Assignment</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Grade Assignment Modal -->
  <div class="app-modal" id="gradeAssignmentModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2><i class="fas fa-star"></i> Grade Submission</h2>
        <button class="close-modal" onclick="EklavyaXPages.closeModal('gradeAssignmentModal')">&times;</button>
      </div>
      <form onsubmit="event.preventDefault(); EklavyaXPages.submitGrade();" style="display:flex; flex-direction:column; gap:14px;">
        <input type="hidden" id="gradeAssignId">
        <div class="form-group">
          <label>Score / Marks Awarded</label>
          <input type="text" id="gradeScore" class="form-control" placeholder="e.g. 95 / 100" required>
        </div>
        <div class="form-group">
          <label>Teacher Feedback & Remarks</label>
          <textarea id="gradeFeedback" class="form-control" placeholder="Great calculation steps, watch out for units in question 3." required></textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:10px;">
          <button type="button" class="btn-secondary" onclick="EklavyaXPages.closeModal('gradeAssignmentModal')">Cancel</button>
          <button type="submit" class="btn-primary"><i class="fas fa-check"></i> Save Grade</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/page_init.js"></script>
  <script src="../js/app_pages.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initPage("teacher", "login.html");
      EklavyaXPages.initAssignmentsPage("teacher");
    });
  </script>
</body>

</html>
