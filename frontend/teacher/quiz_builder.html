<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Quiz Builder for Teachers | EklavyaX</title>
  <link rel="icon" type="image/png" href="../assets/img/logo.png?v=3.0">
  <link rel="stylesheet" href="../css/global.css?v=3.2">
  <link rel="stylesheet" href="../css/teacher_dashboard.css?v=3.2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <style>
    .builder-layout {
      max-width: 900px;
      margin: 0 auto;
    }
    .builder-card {
      background: var(--card-dark, #14382a);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    .question-form-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--accent-gold);
      font-weight: 600;
      margin-bottom: 6px;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-light);
      background: rgba(0,0,0,0.25);
      color: var(--text);
      font-size: 14px;
    }
    .option-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div class="logo">
        <img src="../assets/img/logo.png?v=3.0" alt="EklavyaX Logo">
        <span class="logo-text">EklavyaX</span>
      </div>
      <nav class="menu">
        <a href="dashboard.html"><i class="fas fa-home"></i> Home</a>
        <a href="analytics.html"><i class="fas fa-chart-pie"></i> Analytics & Heatmap</a>
        <a class="active" href="quiz_builder.html"><i class="fas fa-edit"></i> Quiz Builder</a>
        <a href="student_progress.html"><i class="fas fa-chart-line"></i> Student Progress</a>
        <a href="assignments.html"><i class="fas fa-tasks"></i> Bounties</a>
        <a href="doubts.html"><i class="fas fa-question-circle"></i> Doubts Inbox</a>
        <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
      </nav>
      <div class="profile">
        <img id="userAvatarImg" src="../assets/img/teacher.jpg" alt="Profile">
        <div class="profile-info">
          <strong id="profileName">Teacher</strong>
          <span id="profileAction">Log out</span>
        </div>
      </div>
    </aside>

    <main class="content">
      <section class="top-bar">
        <div class="welcome-text">
          <h1>📝 <strong>Teacher Custom Quiz Builder</strong></h1>
          <h2>Manually construct specialized quizzes or use Groq AI to generate questions in seconds!</h2>
        </div>
      </section>

      <div class="builder-layout">
        <!-- Quiz Metadata Card -->
        <div class="builder-card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h3 style="margin: 0; color: var(--accent-gold);"><i class="fas fa-cog"></i> Quiz Configuration</h3>
            <button onclick="aiGeneratePrompt()" style="background: linear-gradient(135deg, #8b5cf6, #3b82f6); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px;">
              <i class="fas fa-magic"></i> AI Auto-Fill Questions
            </button>
          </div>

          <div class="form-group">
            <label>Quiz Title</label>
            <input type="text" id="quizTitle" placeholder="e.g. Thermodynamics & Heat Capacity Master Quiz">
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
              <label>Subject / Topic</label>
              <input type="text" id="quizTopic" placeholder="e.g. Physics - Thermodynamics">
            </div>
            <div class="form-group">
              <label>Time Limit (Minutes)</label>
              <input type="number" id="quizTime" value="15" min="5" max="60">
            </div>
          </div>

          <div class="form-group">
            <label>Instructions & Description</label>
            <textarea id="quizDesc" rows="2" placeholder="Instructions for students..."></textarea>
          </div>
        </div>

        <!-- Questions Section -->
        <div id="questionsContainer">
          <!-- Dynamically added question cards -->
        </div>

        <!-- Bottom Action Bar -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
          <button onclick="addQuestionCard()" style="background: var(--glass-bg); color: var(--text); border: 1px solid var(--border-light); padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer;">
            <i class="fas fa-plus"></i> Add Another Question
          </button>
          <button onclick="publishQuiz()" style="background: var(--accent-gold); color: #0b281d; border: none; padding: 12px 28px; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer;">
            <i class="fas fa-paper-plane"></i> Save & Publish Quiz
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/page_init.js"></script>
  <script src="../js/theme_toggle.js"></script>
  <script>
    let questionCards = [];

    function addQuestionCard(data = null) {
      const id = Date.now() + Math.floor(Math.random() * 1000);
      const cardObj = {
        id,
        prompt: data ? data.prompt : "",
        option_a: data ? data.option_a : "",
        option_b: data ? data.option_b : "",
        option_c: data ? data.option_c : "",
        option_d: data ? data.option_d : "",
        correct_option_index: data ? data.correct_option_index : 0,
        explanation: data ? data.explanation : "",
      };
      questionCards.push(cardObj);
      renderQuestionCards();
    }

    function removeQuestionCard(id) {
      questionCards = questionCards.filter(q => q.id !== id);
      renderQuestionCards();
    }

    function renderQuestionCards() {
      const container = document.getElementById("questionsContainer");
      container.innerHTML = questionCards.map((q, idx) => `
        <div class="question-form-card" id="qcard-${q.id}">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <strong style="color: var(--accent-gold);">Question ${idx + 1}</strong>
            <button onclick="removeQuestionCard(${q.id})" style="background: transparent; border: none; color: #ef4444; cursor: pointer; font-size: 14px;">
              <i class="fas fa-trash-alt"></i> Remove
            </button>
          </div>

          <div class="form-group">
            <label>Question Prompt</label>
            <textarea id="prompt-${q.id}" rows="2" placeholder="Write question statement...">${q.prompt}</textarea>
          </div>

          <div class="option-grid">
            <div class="form-group">
              <label>Option A</label>
              <input type="text" id="opta-${q.id}" value="${q.option_a}" placeholder="Option A text">
            </div>
            <div class="form-group">
              <label>Option B</label>
              <input type="text" id="optb-${q.id}" value="${q.option_b}" placeholder="Option B text">
            </div>
            <div class="form-group">
              <label>Option C</label>
              <input type="text" id="optc-${q.id}" value="${q.option_c}" placeholder="Option C text">
            </div>
            <div class="form-group">
              <label>Option D</label>
              <input type="text" id="optd-${q.id}" value="${q.option_d}" placeholder="Option D text">
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 14px; margin-top: 10px;">
            <div class="form-group">
              <label>Correct Option</label>
              <select id="correct-${q.id}">
                <option value="0" ${q.correct_option_index === 0 ? 'selected' : ''}>Option A</option>
                <option value="1" ${q.correct_option_index === 1 ? 'selected' : ''}>Option B</option>
                <option value="2" ${q.correct_option_index === 2 ? 'selected' : ''}>Option C</option>
                <option value="3" ${q.correct_option_index === 3 ? 'selected' : ''}>Option D</option>
              </select>
            </div>
            <div class="form-group">
              <label>Step-by-Step AI Explanation</label>
              <input type="text" id="exp-${q.id}" value="${q.explanation}" placeholder="Derivation or reason why this answer is correct">
            </div>
          </div>
        </div>
      `).join("");
    }

    async function aiGeneratePrompt() {
      const topic = document.getElementById("quizTopic").value.trim() || prompt("Konse topic pe questions chahiye? (e.g. Newton's Laws of Motion):", "Physics - Mechanics");
      if (!topic) return;

      alert("Groq AI se 3 questions generate ho rahe hain...");
      try {
        const res = await EklavyaXAPI.generateAIQuiz(topic, 3);
        if (res && res.questions) {
          res.questions.forEach(q => {
            const opts = q.options || ["A", "B", "C", "D"];
            addQuestionCard({
              prompt: q.prompt,
              option_a: opts[0] || "",
              option_b: opts[1] || "",
              option_c: opts[2] || "",
              option_d: opts[3] || "",
              correct_option_index: q.correct_index || 0,
              explanation: q.explanation || "Concept derivation validated by Eklavya AI.",
            });
          });
          alert("3 AI-generated questions add ho gaye!");
        }
      } catch (err) {
        alert("AI generation error: " + err.message);
      }
    }

    async function publishQuiz() {
      const title = document.getElementById("quizTitle").value.trim();
      const topic = document.getElementById("quizTopic").value.trim();
      const desc = document.getElementById("quizDesc").value.trim();
      const timeLimit = parseInt(document.getElementById("quizTime").value) || 15;

      if (!title || !topic) return alert("Quiz Title aur Topic bharna zaroori hai.");
      if (questionCards.length === 0) return alert("Kam se kam 1 question add karein.");

      // Harvest question values from DOM
      const questionsData = [];
      for (const q of questionCards) {
        const promptVal = document.getElementById(`prompt-${q.id}`).value.trim();
        const aVal = document.getElementById(`opta-${q.id}`).value.trim();
        const bVal = document.getElementById(`optb-${q.id}`).value.trim();
        const cVal = document.getElementById(`optc-${q.id}`).value.trim();
        const dVal = document.getElementById(`optd-${q.id}`).value.trim();
        const correctIdx = parseInt(document.getElementById(`correct-${q.id}`).value) || 0;
        const expVal = document.getElementById(`exp-${q.id}`).value.trim();

        if (!promptVal || !aVal || !bVal) {
          return alert("Sabhi questions ke statements aur options fill karein.");
        }

        questionsData.push({
          prompt: promptVal,
          option_a: aVal,
          option_b: bVal,
          option_c: cVal,
          option_d: dVal,
          correct_option_index: correctIdx,
          explanation: expVal,
          difficulty: "medium",
        });
      }

      try {
        const res = await EklavyaXAPI.createTeacherQuiz({
          title,
          topic,
          description: desc,
          time_limit_minutes: timeLimit,
          is_published: true,
          questions: questionsData,
        });

        alert(`Quiz '${res.title}' (${res.question_count} questions) safaltapoorvak publish ho gaya!`);
        window.location.href = "dashboard.html";
      } catch (err) {
        alert("Error publishing quiz: " + err.message);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      initPage("teacher", "login.html");
      // Add initial empty question card
      addQuestionCard();
    });
  </script>
</body>
</html>
