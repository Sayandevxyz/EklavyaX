<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revision Bookmarks Vault | Eklavya</title>
  <link rel="icon" type="image/png" href="../assets/img/logo.png?v=3.0">
  <link rel="stylesheet" href="../css/global.css?v=3.2">
  <link rel="stylesheet" href="../css/student_dashboard.css?v=3.2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #071510;
      color: #e2e8f0;
      margin: 0;
      min-height: 100vh;
    }
    .bm-header {
      background: linear-gradient(135deg, rgba(16, 45, 34, 0.95), rgba(7, 21, 16, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 22px 26px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
    }
    .bm-card {
      background: linear-gradient(135deg, rgba(16, 45, 34, 0.8), rgba(9, 27, 20, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .bm-card:hover {
      border-color: rgba(244, 174, 37, 0.3);
      transform: translateY(-2px);
    }
    .filter-pills {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .fpill {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #94a3b8;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .fpill:hover {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }
    .fpill.active {
      background: var(--accent-gold, #f4ae25);
      color: #0b281d;
      border-color: var(--accent-gold, #f4ae25);
      box-shadow: 0 4px 14px rgba(244, 174, 37, 0.3);
    }
    .btn-action {
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      transition: all 0.2s;
    }
    .btn-green {
      background: #10b981;
      color: #fff;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }
    .btn-green:hover {
      background: #059669;
      transform: translateY(-1px);
    }
    .btn-gold {
      background: #f4ae25;
      color: #071510;
      box-shadow: 0 4px 14px rgba(244, 174, 37, 0.3);
    }
    .btn-gold:hover {
      background: #e09b15;
      transform: translateY(-1px);
    }
    /* Modal styles */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-box {
      background: linear-gradient(135deg, #0d281e 0%, #081e16 100%);
      border: 1px solid rgba(244, 174, 37, 0.3);
      border-radius: 18px;
      max-width: 620px;
      width: 100%;
      padding: 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      max-height: 90vh;
      overflow-y: auto;
    }
    .form-input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 13px;
      margin-top: 6px;
      margin-bottom: 14px;
    }
    .form-input:focus {
      outline: none;
      border-color: #f4ae25;
    }
  </style>
</head>
<body>
  <div class="container" style="max-width: 1120px; margin: 0 auto; padding: 24px 16px 60px 16px;">
    <!-- Top Header -->
    <header class="bm-header">
      <div style="display: flex; align-items: center; gap: 16px;">
        <img src="../assets/img/logo.png?v=3.0" style="width: 48px; height: 48px; border-radius: 10px;" alt="Logo">
        <div>
          <h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 24px; color: #f4ae25; font-weight: 700; display: flex; align-items: center; gap: 10px;">
            <i class="fas fa-bookmark"></i> Revision Bookmarks Vault
          </h1>
          <span style="font-size: 13px; color: #94a3b8;">
            Revisit tricky derivations, high-yield formulas, and exam mistakes with step-by-step keys.
          </span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
        <div style="background: rgba(244, 174, 37, 0.15); border: 1px solid rgba(244, 174, 37, 0.3); padding: 8px 16px; border-radius: 12px; display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 18px;">🪙</span>
          <span id="headerCoinCount" style="font-family: 'Outfit', sans-serif; font-weight: 700; color: #f4ae25; font-size: 16px;">1,450</span>
          <span style="font-size: 11px; color: #94a3b8; text-transform: uppercase;">EduCoins</span>
        </div>
        <a href="pyq_arena.html" class="fpill" style="text-decoration: none;">
          <i class="fas fa-stopwatch"></i> PYQ Arena
        </a>
        <a href="student_dashboard.html" class="fpill" style="text-decoration: none;">
          <i class="fas fa-home"></i> Dashboard
        </a>
      </div>
    </header>

    <!-- Controls Row: Filters + Add Button + Drill -->
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 24px;">
      <div class="filter-pills">
        <button class="fpill active" id="fAll" onclick="filterBM('all')">
          <i class="fas fa-th-large"></i> All (<span id="countAll">0</span>)
        </button>
        <button class="fpill" id="fPhysics" onclick="filterBM('Physics')">
          <i class="fas fa-atom"></i> Physics (<span id="countPhysics">0</span>)
        </button>
        <button class="fpill" id="fChemistry" onclick="filterBM('Chemistry')">
          <i class="fas fa-flask"></i> Chemistry (<span id="countChemistry">0</span>)
        </button>
        <button class="fpill" id="fMath" onclick="filterBM('Mathematics')">
          <i class="fas fa-square-root-alt"></i> Mathematics (<span id="countMath">0</span>)
        </button>
        <button class="fpill" id="fBio" onclick="filterBM('Biology')">
          <i class="fas fa-dna"></i> Biology (<span id="countBio">0</span>)
        </button>
      </div>

      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button onclick="openAddBookmarkModal()" class="btn-action btn-gold">
          <i class="fas fa-plus"></i> + Add Custom Bookmark
        </button>
        <button onclick="startBookmarkDrill()" class="btn-action btn-green">
          <i class="fas fa-play"></i> Practice My Bookmarks (+25 🪙)
        </button>
      </div>
    </div>

    <!-- Bookmarks List -->
    <div id="bookmarksContainer">
      <!-- Rendered by JS -->
    </div>
  </div>

  <!-- Modal 1: Add Custom Bookmark -->
  <div class="modal-overlay" id="addBookmarkModal">
    <div class="modal-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;">
        <h3 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 20px; color: #f4ae25; display: flex; align-items: center; gap: 8px;">
          <i class="fas fa-bookmark"></i> Save Custom Revision Item
        </h3>
        <button onclick="closeAddBookmarkModal()" style="background: transparent; border: none; color: #94a3b8; font-size: 20px; cursor: pointer;">&times;</button>
      </div>

      <form id="addBookmarkForm" onsubmit="saveCustomBookmark(event)">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div>
            <label style="font-size: 12px; color: #cbd5e1; font-weight: 600;">Subject *</label>
            <select id="bmSubject" class="form-input" required>
              <option value="Physics">Physics</option>
              <option value="Chemistry">Chemistry</option>
              <option value="Mathematics">Mathematics</option>
              <option value="Biology">Biology</option>
            </select>
          </div>
          <div>
            <label style="font-size: 12px; color: #cbd5e1; font-weight: 600;">Topic / Chapter *</label>
            <input type="text" id="bmTopic" class="form-input" placeholder="e.g. Thermodynamics, Calculus" required>
          </div>
        </div>

        <div>
          <label style="font-size: 12px; color: #cbd5e1; font-weight: 600;">Problem Statement or Tricky Concept *</label>
          <textarea id="bmPrompt" class="form-input" rows="3" placeholder="Enter the exact derivation, question, or formula that requires repeat revision..." required></textarea>
        </div>

        <div>
          <label style="font-size: 12px; color: #cbd5e1; font-weight: 600;">Correct Derivation / Solution Key *</label>
          <textarea id="bmExplanation" class="form-input" rows="2" placeholder="Step-by-step mathematical reasoning or key formula..." required></textarea>
        </div>

        <div>
          <label style="font-size: 12px; color: #cbd5e1; font-weight: 600;">Personal Revision Note / Memory Trick</label>
          <input type="text" id="bmNote" class="form-input" placeholder="e.g. Remember to check units; negative sign indicates Lenz's law">
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px;">
          <button type="button" onclick="closeAddBookmarkModal()" style="background: rgba(255,255,255,0.08); border: none; padding: 10px 18px; border-radius: 8px; color: #cbd5e1; font-weight: 600; cursor: pointer;">Cancel</button>
          <button type="submit" class="btn-action btn-gold">
            <i class="fas fa-save"></i> Save into Vault
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal 2: Interactive Bookmarks Practice Drill -->
  <div class="modal-overlay" id="drillModal">
    <div class="modal-box" style="max-width: 680px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="font-size: 20px;">⚡</span>
          <div>
            <h3 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 18px; color: #f4ae25;">
              Revision Drill: Rapid 3-Question Check
            </h3>
            <span style="font-size: 12px; color: #94a3b8;">Testing your bookmarked concepts under focus mode</span>
          </div>
        </div>
        <button onclick="closeDrillModal()" style="background: transparent; border: none; color: #94a3b8; font-size: 22px; cursor: pointer;">&times;</button>
      </div>

      <div id="drillContent">
        <!-- Injected by drill engine -->
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/page_init.js"></script>
  <script src="../js/leaderboard_sync.js"></script>
  <script>
    const DEFAULT_BOOKMARKS = [
      {
        id: 1,
        subject: "Physics",
        topic: "Rotational Dynamics",
        prompt: "A solid sphere (mass M, radius R) rolls without slipping down an inclined plane of angle θ. What is its linear acceleration down the incline?",
        options: ["(5/7) g sin θ", "(3/5) g sin θ", "(2/3) g sin θ", "(1/2) g sin θ"],
        correct_option_index: 0,
        explanation: "For rolling without slipping: a = (g sin θ) / (1 + I / (M R²)). For a solid sphere, I = (2/5) M R². Therefore, a = (g sin θ) / (1 + 2/5) = (5/7) g sin θ.",
        note: "Crucial for JEE Main. Remember: Sphere (5/7) > Disc (2/3) > Ring (1/2). Sphere accelerates fastest!",
        saved_date: "14 Sep 2026"
      },
      {
        id: 2,
        subject: "Physics",
        topic: "Magnetism & Matter",
        prompt: "A magnetic dipole with magnetic moment M is placed in a uniform magnetic field B. What is the torque τ and potential energy U when oriented at angle θ?",
        options: ["τ = M × B, U = -M · B", "τ = M · B, U = M × B", "τ = B / M, U = M B cos θ", "τ = M B sin θ, U = M B sin θ"],
        correct_option_index: 0,
        explanation: "Torque is the vector product τ = M × B = M B sin θ. Potential energy is the scalar dot product U = -M · B = -M B cos θ. Minimum potential energy (stable equilibrium) occurs at θ = 0°.",
        note: "Stable equilibrium at 0° (U = -MB), unstable at 180° (U = +MB).",
        saved_date: "12 Sep 2026"
      },
      {
        id: 3,
        subject: "Chemistry",
        topic: "Aldehydes, Ketones & Carboxylic Acids",
        prompt: "Which of the following compounds does NOT undergo Aldol Condensation in the presence of dilute NaOH?",
        options: ["Benzaldehyde (C₆H₅CHO)", "Acetaldehyde (CH₃CHO)", "Propanal (CH₃CH₂CHO)", "Acetone (CH₃COCH₃)"],
        correct_option_index: 0,
        explanation: "Aldol condensation strictly requires at least one α-hydrogen atom adjacent to the carbonyl carbon. Benzaldehyde lacks an α-hydrogen and instead undergoes the Cannizzaro reaction in concentrated alkali.",
        note: "No alpha-H = Cannizzaro (Benzaldehyde, Formaldehyde, Trimethylacetaldehyde).",
        saved_date: "15 Sep 2026"
      },
      {
        id: 4,
        subject: "Chemistry",
        topic: "Coordination Chemistry",
        prompt: "What is the relationship between Crystal Field Splitting Energy in tetrahedral (Δt) and octahedral (Δo) complexes with the same ligands and metal ions?",
        options: ["Δt = (4/9) Δo", "Δt = (9/4) Δo", "Δt = (2/3) Δo", "Δt = Δo"],
        correct_option_index: 0,
        explanation: "In tetrahedral geometry, there are only 4 ligands instead of 6, and the d-orbitals do not point directly at the incoming ligands. Electrostatic calculations give Δt = (4/9) Δo, which is why tetrahedral complexes are almost always high-spin.",
        note: "Tetrahedral is 4/9 of octahedral; rarely ever forms low spin because Δt < P (pairing energy).",
        saved_date: "10 Sep 2026"
      },
      {
        id: 5,
        subject: "Mathematics",
        topic: "Integral Calculus",
        prompt: "According to the Leibniz Integral Rule, what is d/dx [ ∫ from 0 to x² of cos(t²) dt ]?",
        options: ["2x · cos(x⁴)", "cos(x⁴)", "2x · cos(x²)", "x² · cos(x⁴)"],
        correct_option_index: 0,
        explanation: "By Leibniz's Rule: d/dx [ ∫_{u(x)}^{v(x)} f(t) dt ] = f(v(x)) · v'(x) - f(u(x)) · u'(x). Here v(x) = x², v'(x) = 2x, u(x) = 0. Thus, result = cos((x²)²) · (2x) = 2x cos(x⁴).",
        note: "Chain rule applies inside the upper limit! Don't forget multiplying by (x²)' = 2x.",
        saved_date: "13 Sep 2026"
      },
      {
        id: 6,
        subject: "Mathematics",
        topic: "Vector Algebra",
        prompt: "For any three 3D vectors a, b, and c, what is the vector triple product a × (b × c)?",
        options: ["(a · c)b - (a · b)c", "(a · b)c - (a · c)b", "(b · c)a - (a · c)b", "a × (b · c)"],
        correct_option_index: 0,
        explanation: "Vector Triple Product identity: a × (b × c) = (a · c)b - (a · b)c. Mnemonic: 'BAC - CAB' rule, where the middle vector b comes first with positive sign.",
        note: "Remember 'BAC - CAB' formula: b(a·c) - c(a·b).",
        saved_date: "09 Sep 2026"
      },
      {
        id: 7,
        subject: "Biology",
        topic: "Human Physiology: Excretory Products",
        prompt: "The counter-current mechanism in the mammalian nephron operates primarily between which two anatomical structures?",
        options: ["Henle's loop and Vasa recta", "Bowman's capsule and Glomerulus", "Proximal Convoluted Tubule and Distal Convoluted Tubule", "Afferent arteriole and Efferent arteriole"],
        correct_option_index: 0,
        explanation: "The flow of filtrate in the two limbs of Henle's loop is in opposite directions (counter-current), and the flow of blood through the two limbs of the vasa recta is also in opposite directions. The proximity between them maintains an osmotic gradient of 300 to 1200 mOsmol/L in the medullary interstitium.",
        note: "Descending limb permeable to water, ascending permeable to electrolytes (NaCl). Crucial for urine concentration.",
        saved_date: "11 Sep 2026"
      },
      {
        id: 8,
        subject: "Biology",
        topic: "Genetics & Evolution",
        prompt: "In a population at Hardy-Weinberg equilibrium, the frequency of a recessive homozygous genotype (aa) is 0.16. What is the frequency of heterozygous carriers (Aa)?",
        options: ["0.48", "0.24", "0.36", "0.64"],
        correct_option_index: 0,
        explanation: "Here q² = 0.16 ⇒ q = √0.16 = 0.4. Since p + q = 1, p = 1 - 0.4 = 0.6. Frequency of heterozygotes = 2pq = 2 × 0.6 × 0.4 = 0.48 (48%).",
        note: "Formula: p² + 2pq + q² = 1. Always solve for q first using the homozygous recessive frequency.",
        saved_date: "14 Sep 2026"
      }
    ];

    let bookmarksData = [];
    let currentFilter = "all";

    function getLocalVault() {
      try {
        const stored = localStorage.getItem("eklavya_bookmarks");
        if (stored) {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
      } catch (e) {
        console.warn("Error reading local vault", e);
      }
      localStorage.setItem("eklavya_bookmarks", JSON.stringify(DEFAULT_BOOKMARKS));
      return DEFAULT_BOOKMARKS;
    }

    function saveLocalVault(arr) {
      localStorage.setItem("eklavya_bookmarks", JSON.stringify(arr));
    }

    async function loadBookmarks() {
      let vault = getLocalVault();
      try {
        const token = localStorage.getItem("token") || localStorage.getItem("access_token");
        if (token) {
          const res = await fetch("/api/pedagogy/bookmarks", { headers: { "Authorization": `Bearer ${token}` } });
          if (res.ok) {
            const data = await res.json();
            if (data.bookmarks && data.bookmarks.length > 0) {
              // Merge remote into local
              vault = data.bookmarks;
              saveLocalVault(vault);
            }
          }
        }
      } catch (err) {
        console.warn("Remote bookmarks unavailable, using local vault:", err.message);
      }
      bookmarksData = vault;
      updateBadgeCounts();
      renderList();
      syncCoinsDisplay();
    }

    function syncCoinsDisplay() {
      if (window.LeaderboardSync) {
        const st = window.LeaderboardSync.getStudentById("sayan");
        if (st) {
          document.getElementById("headerCoinCount").textContent = Number(st.eduCoins || 1450).toLocaleString();
        }
      }
    }

    function updateBadgeCounts() {
      const allC = bookmarksData.length;
      const phyC = bookmarksData.filter(b => (b.subject || "").toLowerCase().includes("physic")).length;
      const chemC = bookmarksData.filter(b => (b.subject || "").toLowerCase().includes("chem")).length;
      const mathC = bookmarksData.filter(b => (b.subject || "").toLowerCase().includes("math")).length;
      const bioC = bookmarksData.filter(b => (b.subject || "").toLowerCase().includes("bio")).length;

      document.getElementById("countAll").textContent = allC;
      document.getElementById("countPhysics").textContent = phyC;
      document.getElementById("countChemistry").textContent = chemC;
      document.getElementById("countMath").textContent = mathC;
      document.getElementById("countBio").textContent = bioC;
    }

    function filterBM(subj) {
      currentFilter = subj;
      document.querySelectorAll('.fpill').forEach(b => b.classList.remove('active'));
      if (subj === 'all') document.getElementById('fAll').classList.add('active');
      if (subj === 'Physics') document.getElementById('fPhysics').classList.add('active');
      if (subj === 'Chemistry') document.getElementById('fChemistry').classList.add('active');
      if (subj === 'Mathematics') document.getElementById('fMath').classList.add('active');
      if (subj === 'Biology') document.getElementById('fBio').classList.add('active');
      renderList();
    }

    function renderList() {
      const filtered = bookmarksData.filter(b => {
        if (currentFilter === "all") return true;
        return (b.subject || "").toLowerCase().includes(currentFilter.toLowerCase());
      });

      const container = document.getElementById("bookmarksContainer");
      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bm-card" style="text-align:center; padding: 48px 20px;">
            <i class="far fa-bookmark" style="font-size: 36px; color: var(--accent-gold); margin-bottom: 14px;"></i>
            <h3 style="color:#fff; margin: 0 0 8px 0; font-family: 'Outfit', sans-serif;">No Bookmarks Saved in ${currentFilter === 'all' ? 'any subject' : currentFilter}</h3>
            <p style="color:#94a3b8; font-size:13px; max-width: 480px; margin: 0 auto 18px auto;">
              Save questions during your Daily STEM Quiz or PYQ sessions, or click "+ Add Custom Bookmark" above to build your revision cards.
            </p>
            <button onclick="openAddBookmarkModal()" class="btn-action btn-gold">
              <i class="fas fa-plus"></i> Add a Question Now
            </button>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(b => {
        let opts = [];
        try {
          opts = Array.isArray(b.options) ? b.options : JSON.parse(b.options || "[]");
        } catch (_) {}

        const subjColor = b.subject === "Physics" ? "#38bdf8" : (b.subject === "Chemistry" ? "#a78bfa" : (b.subject === "Biology" ? "#34d399" : "#fbbf24"));

        return `
          <div class="bm-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
              <div style="display:flex; align-items:center; gap:8px;">
                <span style="font-size:11px; padding:3px 10px; border-radius:6px; background:${subjColor}25; color:${subjColor}; font-weight:800; text-transform:uppercase; border: 1px solid ${subjColor}40;">
                  ${b.subject}
                </span>
                <span style="font-size:13px; color:#cbd5e1; font-weight:700;">${b.topic}</span>
              </div>
              <span style="font-size:12px; color:#94a3b8;">
                <i class="far fa-clock"></i> Saved ${b.saved_date || 'Recently'}
              </span>
            </div>

            <h3 style="font-size: 16px; font-weight:600; color: #fff; margin: 0 0 14px 0; line-height: 1.55;">
              ${b.prompt}
            </h3>

            ${opts.length > 0 ? `
              <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:8px; margin-bottom: 14px;">
                ${opts.map((opt, idx) => `
                  <div style="padding:10px 14px; border-radius:8px; background:${idx === b.correct_option_index ? 'rgba(16,185,129,0.18)' : 'rgba(255,255,255,0.03)'}; border:1px solid ${idx === b.correct_option_index ? '#10b981' : 'rgba(255,255,255,0.08)'}; font-size:13px; color:${idx === b.correct_option_index ? '#34d399' : '#cbd5e1'}; font-weight:${idx === b.correct_option_index ? '600' : '400'};">
                    <strong>${String.fromCharCode(65 + idx)}:</strong> ${opt} ${idx === b.correct_option_index ? '✅ (Key)' : ''}
                  </div>
                `).join("")}
              </div>
            ` : ''}

            ${b.explanation ? `
              <div style="background:rgba(0,0,0,0.3); border-radius:10px; padding:12px 16px; font-size:13px; color:#cbd5e1; margin-bottom:12px; border-left: 3px solid var(--accent-gold);">
                <strong style="color:var(--accent-gold); display: block; margin-bottom: 4px;">
                  <i class="fas fa-lightbulb"></i> Solution & Derivation:
                </strong>
                ${b.explanation}
              </div>
            ` : ''}

            ${b.note ? `
              <div style="font-size:12px; color:#fef08a; margin-bottom:14px; background: rgba(244,174,37,0.08); padding: 8px 12px; border-radius: 8px;">
                <i class="fas fa-sticky-note"></i> <strong>Revision Note:</strong> ${b.note}
              </div>
            ` : ''}

            <div style="display:flex; justify-content:space-between; align-items:center; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 12px;">
              <button onclick="launchSingleDrill(${b.id})" style="background:rgba(16,185,129,0.15); border:1px solid rgba(16,185,129,0.4); color:#34d399; padding:6px 14px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer;">
                <i class="fas fa-bolt"></i> Practice This Question
              </button>
              <button onclick="removeBookmark(${b.id})" style="background:transparent; border:1px solid rgba(239,68,68,0.3); color:#f87171; padding:6px 14px; border-radius:8px; font-size:12px; cursor:pointer; transition: all 0.2s;">
                <i class="fas fa-trash-alt"></i> Remove
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    function removeBookmark(id) {
      if (!confirm("Are you sure you want to remove this bookmark from your vault?")) return;
      bookmarksData = bookmarksData.filter(b => b.id !== id);
      saveLocalVault(bookmarksData);
      updateBadgeCounts();
      renderList();
    }

    function openAddBookmarkModal() {
      document.getElementById("addBookmarkModal").style.display = "flex";
    }

    function closeAddBookmarkModal() {
      document.getElementById("addBookmarkModal").style.display = "none";
      document.getElementById("addBookmarkForm").reset();
    }

    function saveCustomBookmark(e) {
      e.preventDefault();
      const subject = document.getElementById("bmSubject").value;
      const topic = document.getElementById("bmTopic").value.trim();
      const prompt = document.getElementById("bmPrompt").value.trim();
      const explanation = document.getElementById("bmExplanation").value.trim();
      const note = document.getElementById("bmNote").value.trim();

      const newBm = {
        id: Date.now(),
        subject,
        topic,
        prompt,
        options: [],
        correct_option_index: 0,
        explanation,
        note,
        saved_date: "Today"
      };

      bookmarksData.unshift(newBm);
      saveLocalVault(bookmarksData);
      updateBadgeCounts();
      renderList();
      closeAddBookmarkModal();

      if (window.LeaderboardSync) {
        window.LeaderboardSync.updateStudent("sayan", {
          eduCoins: (window.LeaderboardSync.getStudentById("sayan")?.eduCoins || 1450) + 10
        });
        syncCoinsDisplay();
      }
      alert("✅ Bookmark saved to your vault! +10 EduCoins awarded.");
    }

    /* Drill Engine */
    let drillQuestions = [];
    let drillIdx = 0;
    let drillScore = 0;

    function startBookmarkDrill() {
      if (bookmarksData.length === 0) {
        alert("Please save some bookmarks first before starting a practice drill.");
        return;
      }
      drillQuestions = [...bookmarksData].sort(() => 0.5 - Math.random()).slice(0, 3);
      drillIdx = 0;
      drillScore = 0;
      document.getElementById("drillModal").style.display = "flex";
      renderDrillStep();
    }

    function launchSingleDrill(id) {
      const q = bookmarksData.find(x => x.id === id);
      if (!q) return;
      drillQuestions = [q];
      drillIdx = 0;
      drillScore = 0;
      document.getElementById("drillModal").style.display = "flex";
      renderDrillStep();
    }

    function closeDrillModal() {
      document.getElementById("drillModal").style.display = "none";
    }

    function renderDrillStep() {
      const q = drillQuestions[drillIdx];
      const box = document.getElementById("drillContent");

      let opts = [];
      try {
        opts = Array.isArray(q.options) ? q.options : JSON.parse(q.options || "[]");
      } catch (_) {}

      // If no options stored, create a self-assessment drill
      if (opts.length === 0) {
        box.innerHTML = `
          <div style="background: rgba(0,0,0,0.25); border-radius: 12px; padding: 18px; margin-bottom: 16px;">
            <div style="display:flex; justify-content:space-between; margin-bottom: 8px;">
              <span style="font-size: 11px; padding: 2px 8px; border-radius: 4px; background: rgba(244,174,37,0.2); color: #f4ae25; font-weight: 700;">${q.subject} • ${q.topic}</span>
              <span style="font-size: 12px; color: #94a3b8;">Card ${drillIdx + 1} of ${drillQuestions.length}</span>
            </div>
            <h4 style="color: #fff; font-size: 16px; margin: 0 0 12px 0;">${q.prompt}</h4>
            <div id="selfRevealBox" style="display: none; background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); border-radius: 10px; padding: 14px; margin-top: 14px;">
              <strong style="color: #34d399; font-size: 13px;">Key Formula / Derivation:</strong>
              <p style="font-size: 13px; color: #e2e8f0; margin: 6px 0 0 0;">${q.explanation}</p>
            </div>
          </div>
          <div id="drillControls" style="display: flex; justify-content: flex-end; gap: 10px;">
            <button onclick="revealSelfAnswer()" style="background: #f4ae25; color: #071510; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer;">
              Reveal Solution
            </button>
          </div>
        `;
        return;
      }

      box.innerHTML = `
        <div style="background: rgba(0,0,0,0.25); border-radius: 12px; padding: 18px; margin-bottom: 16px;">
          <div style="display:flex; justify-content:space-between; margin-bottom: 8px;">
            <span style="font-size: 11px; padding: 2px 8px; border-radius: 4px; background: rgba(244,174,37,0.2); color: #f4ae25; font-weight: 700;">${q.subject} • ${q.topic}</span>
            <span style="font-size: 12px; color: #94a3b8;">Question ${drillIdx + 1} of ${drillQuestions.length}</span>
          </div>
          <h4 style="color: #fff; font-size: 16px; margin: 0 0 16px 0; line-height: 1.5;">${q.prompt}</h4>
          <div style="display: grid; gap: 10px;">
            ${opts.map((opt, oIdx) => `
              <button onclick="handleDrillChoice(${oIdx})" id="drillOptBtn_${oIdx}" style="text-align: left; padding: 12px 16px; border-radius: 10px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: #e2e8f0; font-size: 14px; cursor: pointer; transition: all 0.2s;">
                <strong style="color: #f4ae25;">${String.fromCharCode(65 + oIdx)}:</strong> ${opt}
              </button>
            `).join("")}
          </div>
        </div>
        <div id="drillFeedback" style="margin-bottom: 14px;"></div>
      `;
    }

    function revealSelfAnswer() {
      document.getElementById("selfRevealBox").style.display = "block";
      document.getElementById("drillControls").innerHTML = `
        <button onclick="nextDrillQuestion(true)" style="background: #10b981; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer;">
          I Mastered This! Next &rarr;
        </button>
      `;
    }

    function handleDrillChoice(chosenIdx) {
      const q = drillQuestions[drillIdx];
      const isCorrect = chosenIdx === q.correct_option_index;
      if (isCorrect) drillScore++;

      document.querySelectorAll("[id^='drillOptBtn_']").forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === q.correct_option_index) {
          btn.style.background = "rgba(16,185,129,0.25)";
          btn.style.borderColor = "#10b981";
          btn.style.color = "#34d399";
        } else if (idx === chosenIdx) {
          btn.style.background = "rgba(239,68,68,0.25)";
          btn.style.borderColor = "#ef4444";
          btn.style.color = "#f87171";
        }
      });

      const fb = document.getElementById("drillFeedback");
      fb.innerHTML = `
        <div style="background: ${isCorrect ? 'rgba(16,185,129,0.1)' : 'rgba(239,68,68,0.1)'}; border: 1px solid ${isCorrect ? '#10b981' : '#ef4444'}; border-radius: 10px; padding: 12px 16px; margin-bottom: 12px;">
          <strong style="color: ${isCorrect ? '#34d399' : '#f87171'}; font-size: 14px;">
            ${isCorrect ? '✅ Spot on! Excellent Recall.' : '❌ Not quite right.'}
          </strong>
          <p style="font-size: 13px; color: #cbd5e1; margin: 4px 0 0 0;">${q.explanation}</p>
        </div>
        <div style="text-align: right;">
          <button onclick="nextDrillQuestion()" style="background: #f4ae25; color: #071510; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 700; cursor: pointer;">
            ${drillIdx + 1 < drillQuestions.length ? 'Next Question &rarr;' : 'Finish Drill & Collect Coins'}
          </button>
        </div>
      `;
    }

    function nextDrillQuestion(autoCorrect = false) {
      if (autoCorrect) drillScore++;
      drillIdx++;
      if (drillIdx < drillQuestions.length) {
        renderDrillStep();
      } else {
        finishDrill();
      }
    }

    function finishDrill() {
      const earnedCoins = drillScore * 10 + 5;
      if (window.LeaderboardSync) {
        const current = window.LeaderboardSync.getStudentById("sayan");
        const newTotal = (current?.eduCoins || 1450) + earnedCoins;
        window.LeaderboardSync.updateStudent("sayan", { eduCoins: newTotal });
        syncCoinsDisplay();
      }

      const box = document.getElementById("drillContent");
      box.innerHTML = `
        <div style="text-align: center; padding: 24px 0;">
          <div style="font-size: 48px; margin-bottom: 10px;">🏆</div>
          <h3 style="font-family: 'Outfit', sans-serif; font-size: 22px; color: #fff; margin: 0 0 8px 0;">
            Drill Complete!
          </h3>
          <p style="font-size: 14px; color: #94a3b8; margin: 0 0 20px 0;">
            Score: <strong style="color: #34d399;">${drillScore} / ${drillQuestions.length}</strong> Correct
          </p>
          <div style="background: rgba(244,174,37,0.15); border: 1px solid rgba(244,174,37,0.4); border-radius: 12px; padding: 16px; margin-bottom: 20px; display: inline-block;">
            <div style="font-size: 13px; color: #cbd5e1;">EduCoins Earned</div>
            <div style="font-size: 26px; font-weight: 800; color: #f4ae25; font-family: 'Outfit', sans-serif;">+${earnedCoins} 🪙</div>
          </div>
          <div>
            <button onclick="closeDrillModal()" class="btn-action btn-gold">
              Return to Bookmarks Vault
            </button>
          </div>
        </div>
      `;
    }

    document.addEventListener("DOMContentLoaded", () => {
      initPage("student", "student_login.html");
      loadBookmarks();

      if (window.LeaderboardSync) {
        window.LeaderboardSync.onSync(() => {
          syncCoinsDisplay();
        });
      }
    });
  </script>
</body>
</html>
