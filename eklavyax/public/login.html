<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — EklavyaX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="void-field" aria-hidden="true"></div>

  <div class="auth-shell">
    <a href="index.html" class="back-link">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
        <path d="M19 12H5M5 12L11 6M5 12L11 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
      Back
    </a>

    <div class="auth-card">
      <div class="auth-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M4 7L12 3L20 7L12 11L4 7Z" fill="#0a0b12" />
          <path d="M4 12L12 16L20 12" stroke="#0a0b12" stroke-width="2" stroke-linecap="round" />
          <path d="M4 17L12 21L20 17" stroke="#0a0b12" stroke-width="2" stroke-linecap="round" />
        </svg>
      </div>
      <h1 class="display">Welcome back</h1>
      <p>Sign in to continue your journey</p>

      <div class="role-toggle" role="tablist" aria-label="I am a">
        <button type="button" class="active" data-role="student" role="tab" aria-selected="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
            <path d="M2 9L12 4L22 9L12 14L2 9Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
            <path d="M6 11V16C6 16 8.5 18 12 18C15.5 18 18 16 18 16V11" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Student
        </button>
        <button type="button" data-role="teacher" role="tab" aria-selected="false">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.8" />
            <path d="M5 20C5 16.5 8 14 12 14C16 14 19 16.5 19 20" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" />
          </svg>
          Teacher
        </button>
      </div>

      <p id="authError" class="auth-error" hidden></p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <span class="icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="5" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="1.7" />
                <path d="M4 7L12 13L20 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </span>
            <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <rect x="4" y="10" width="16" height="10" rx="2.2" stroke="currentColor" stroke-width="1.7" />
                <path d="M7.5 10V7.5C7.5 5 9.5 3 12 3C14.5 3 16.5 5 16.5 7.5V10" stroke="currentColor"
                  stroke-width="1.7" />
              </svg>
            </span>
            <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="show-toggle" id="toggleShow">Show</button>
          </div>
        </div>

        <div class="row-between">
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>
      </form>

      <div class="divider">or</div>

      <button type="button" class="btn-google">
        <svg width="17" height="17" viewBox="0 0 24 24">
          <path fill="#4285F4"
            d="M23.49 12.27c0-.79-.07-1.54-.2-2.27H12v4.3h6.47a5.53 5.53 0 0 1-2.4 3.63v3h3.87c2.27-2.09 3.55-5.17 3.55-8.66z" />
          <path fill="#34A853"
            d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.87-3c-1.08.72-2.45 1.15-4.06 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.1A12 12 0 0 0 12 24z" />
          <path fill="#FBBC05"
            d="M5.27 14.28A7.2 7.2 0 0 1 4.88 12c0-.79.14-1.56.39-2.28v-3.1H1.27A12 12 0 0 0 0 12c0 1.93.47 3.76 1.27 5.38l4-3.1z" />
          <path fill="#EA4335"
            d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.94 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.27 6.62l4 3.1C6.22 6.86 8.87 4.75 12 4.75z" />
        </svg>
        Continue with Google
      </button>

      <p class="auth-foot">New to EklavyaX? <a href="#">Create an account</a></p>
      <p class="auth-demo">Demo: <code>arjun@EklavyaX.com</code> / <code>kavitha@EklavyaX.com</code> — password
        <code>password123</code>
      </p>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
